[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.33.1"
ci = "github"
installers = ["shell", "powershell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
checksum = "sha256"
install-path = "~/.local/bin"
install-updater = false
pr-run-mode = "plan"
hosting = "github"
# Public repository: GitHub-hosted runners only, never self-hosted.
github-custom-runners = { global = "ubuntu-latest", aarch64-apple-darwin = "macos-15" }
# Actions pinned to commit SHAs (checkout v6, upload-artifact v7, download-artifact v8).
github-action-commits = { "actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803", "actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9", "actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" }
