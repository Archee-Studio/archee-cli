# Custom cargo-dist publish job (publish-jobs in dist-workspace.toml): pushes the generated
# Homebrew formula to the tap as shipbot, the Archee Shipbot GitHub App.
name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# No GITHUB_TOKEN scopes: the push uses the shipbot App token. A called workflow may not ask for more
# than its caller grants, and release.yml's publish job grants only id-token and packages.
permissions: {}

jobs:
  publish-homebrew:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: artifacts-*
          path: formulae
          merge-multiple: true
      - name: Mint the shipbot token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SHIPBOT_APP_ID }}
          private-key: ${{ secrets.SHIPBOT_PRIVATE_KEY }}
          owner: Archee-Studio
          repositories: homebrew-tap
      - name: Push the formula to the tap
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The token rides in a per-command header, never in .git/config.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0); echo "::add-mask::$auth"
          # The tap is public, so the clone needs no credential. It may be empty (no commits):
          # start main there, and push to main by name.
          timeout 120 git clone https://github.com/Archee-Studio/homebrew-tap.git /tmp/tap
          git -C /tmp/tap checkout -q -B main
          mkdir -p /tmp/tap/Formula
          version=$(echo "$PLAN" | jq -r '.announcement_tag')
          found=0
          for f in formulae/*.rb; do
            [ -e "$f" ] || continue
            found=1
            cp "$f" "/tmp/tap/Formula/$(basename "$f")"
          done
          [ "$found" = 1 ] || { echo "::error::no formula in the release artifacts"; exit 1; }
          cd /tmp/tap
          git add Formula
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to push"
          else
            git -c user.name="archee-shipbot[bot]" -c user.email="356176739+archee-shipbot[bot]@users.noreply.github.com" commit -q -m "archee-cli ${version}"
            timeout 120 git -c http.extraheader="AUTHORIZATION: basic $auth" push origin main
          fi
